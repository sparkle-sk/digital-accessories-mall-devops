# docker-compose.yml —— 一键起 MySQL + SpringBoot 后端 + Nginx 前端
# 用法：docker compose up -d

version: "3.8"

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: digital_mall
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql        # 数据持久化（容器删了数据还在）
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== SpringBoot 后端 =====
  app:
    build:
      context: .                          # 用当前目录的 Dockerfile 构建
      dockerfile: Dockerfile
    container_name: mall-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy        # 等 MySQL 健康了再起
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/digital_mall?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"

  # ===== Nginx 反向代理 + 前端静态托管 =====
  nginx:
    image: nginx:alpine
    container_name: mall-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 把前端 dist 目录挂进去；先在宿主机 npm run build 生成 dist/
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"

volumes:
  mysql_data: