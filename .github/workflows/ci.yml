# GitHub Actions CI 流水线（Option B：导入 SQL 后真跑测试）
# 触发：往 main 分支 push 或提 PR
# 流程：拉代码 → 装 JDK 21 → 构建 → 导入数据库 schema → 跑测试 → 打包 Docker 镜像

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # GitHub 自带的 MySQL 服务容器（默认库名 digital_mall_test）
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: digital_mall_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # 安装 mysql 客户端，用来导入 SQL
      - name: Install mysql client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      # 等 MySQL 真的能连上（healthcheck 通过不代表端口已 ready）
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent; then
              echo "MySQL is up"; break
            fi
            sleep 2
          done

      # 关键步骤：把 graduation 的 SQL 灌进测试库，否则表不存在测试必挂
      - name: Import database schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot123 -e "CREATE DATABASE IF NOT EXISTS digital_mall_test;"
          mysql -h 127.0.0.1 -uroot -proot123 digital_mall_test < digital_accessories.sql

      # 真跑测试（连接 127.0.0.1 的 MySQL 服务容器）
      # 注意：pom.xml 在 ./digital-accessories-server 子目录下，所以要先 cd 进去
      - name: Run tests
        working-directory: ./digital-accessories-server
        run: mvn -B clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/digital_mall_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123

      # 打包产物（无论测试成败都上传，方便排查）
      - name: Upload JAR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t digital-accessories-mall:${{ github.sha }} .

      - name: Save Docker image as artifact
        run: docker save digital-accessories-mall:${{ github.sha }} > /tmp/image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 7
