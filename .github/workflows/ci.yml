# GitHub Actions CI 流水线
# 触发：往 main 分支 push 或提 PR
# 流程：拉代码 → 装 JDK 21 → 构建 → 跑测试 → 打包 Docker 镜像

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # 用 GitHub 自带的 MySQL 服务容器做集成测试
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: digital_mall_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1. 拉代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 装 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 缓存 Maven 依赖（第二次构建会快很多）
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      # 4. 跑构建 + 测试（test 会自动用上面 services 里的 MySQL）
      - name: Run tests
        run: mvn -B clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/digital_mall_test?useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root123

      # 5. 打包 jar（产物会被上传，方便下载）
      - name: Package application
        run: mvn -B clean package -DskipTests

      # 6. 上传构建产物
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test          # 等上一个 job 完成再跑
    if: github.event_name == 'push' # 只在 push 时构建镜像，PR 不构建

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t digital-accessories-mall:${{ github.sha }} .

      - name: Save Docker image as artifact
        run: docker save digital-accessories-mall:${{ github.sha }} > /tmp/image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 7